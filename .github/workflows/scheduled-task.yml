# .github/workflows/scheduled-task.yml

name: Run Python Script Daily

# This trigger starts the workflow on a schedule
on:
  schedule:
    # Runs at 5:30 UTC every day. The format is standard cron syntax.
    - cron: '30 5 * * *'

jobs:
  build:
    # The type of virtual machine to run the job on
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your repository code
      - name: Checkout repo content
        uses: actions/checkout@v4

      # Step 2: Set up the environment (e.g., Python)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install dependencies (if any)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run your script
      - name: Execute Python script
        run: python KEMF_LED_Alert.py
