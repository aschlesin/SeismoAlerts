# .github/workflows/scheduled-task.yml

name: Run main.py

# This trigger starts the workflow on a schedule
on:
  schedule:
    # Runs at 5:30 UTC every day. The format is standard cron syntax.
    - cron: '0 /2 * * *'

jobs:
  build:
    # The type of virtual machine to run the job on
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your repository code
      - name: Checkout repo content
        uses: actions/checkout@v4

      # Step 2: Set up the environment (e.g., Python)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install dependencies (if any)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run your script
      - name: Execute Python script
        run: python main.py
        
      # Step 5: commit files
      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "updated logs" --allow-empty)
      # Step 6: Push changes    
      - name: push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main 
